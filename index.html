<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>North Carolina Summits</title>
    	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-dialog@1.0.5/Leaflet.Dialog.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
 	
	html, body, #map {
    width: 100%;
    height: 100vh;
    margin: 0;
    background: #fff;
}

body {
    font-family: 'Montserrat', sans-serif;
} 

#map-title {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    font-family: 'Montserrat', sans-serif;
    font-size: 24px;
    font-weight: bold;
    color: #333333;
    background: rgba(255, 255, 255, 0.9);
    padding: 8px 18px;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    text-align: center;
    white-space: nowrap;
}

.legend {
    line-height: 25px;
    font-size: 15px;
    width: 190px;
    color: #333333;
    padding: 8px 10px;
    background: white;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    border-radius: 5px;
    font-family: 'Montserrat', sans-serif;
}

.legend i {
    width: 20px;
    height: 20px;
    float: left;
    margin-right: 8px;
    opacity: 0.9;
}

.legend p {
    font-size: 14px;
    line-height: 20px;
    margin: 0;
}

.legend hr {
    border: 0;
    border-top: 1px solid #cccccc;
    margin: 8px 0;
}

.welcome-box {
    font-family: 'Montserrat', sans-serif;
    padding: 15px;
    color: #333333;
}

.welcome-box h2 {
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
    margin-top: 5px;
    margin-bottom: 18px;
}

.welcome-box p {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 14px;
}

.welcome-box ul {
    font-family: 'Montserrat', sans-serif;
    padding-left: 25px;
    font-size: 14px;
    line-height: 1.8;
}

    </style>
    
	<script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/leaflet-dialog@1.0.5/Leaflet.Dialog.min.js"></script> 

</head>
<body>
<!-- Our web map and content will go here -->
<div id="map"></div>
<div id="map-title">
    Mountain Summits Across North Carolina
</div>
<script>
// 1. Create the map
var mymap = L.map('map', {
    center: [35.5, -79.8],
    zoom: 8,
    maxZoom: 24,
    minZoom: 4
});

// 2. Add the base map
var Esri_WorldTopoMap = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles &copy; Esri'
    }
).addTo(mymap);

// 3. Create three colors
var colors = chroma.scale('Set1').mode('lch').colors(3).reverse();

// 4. Create marker styles
for (i = 0; i < 3; i++) {
    $('head').append(
        $("<style> .marker-color-" + (i + 1) +
        " { color: " + colors[i] +
        "; font-size: 18px; text-shadow: 0 0 3px #ffffff;} </style>")
    );
}

var elevationCounts = [0, 0, 0];

// 5. Load summit GeoJSON and classify by elevation
var NC_Summits = L.geoJson.ajax("assets/NC_Summits.geojson", {

    pointToLayer: function(feature, latlng) {

        var elevation = Number(feature.properties.Elevation);
		if (isNaN(elevation)) {
    return null;
}
        var id;

        if (elevation < 609.6) {
    id = 0;
} 
else if (elevation <= 1219.2) {
    id = 1;
} 
else {
    id = 2;
}

		elevationCounts[id]++; 

        return L.marker(latlng, {
    icon: L.divIcon({
        html: '<i class="fas fa-mountain marker-color-' + (id + 1) + '"></i>',
        className: '',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
    })
});
    },

    onEachFeature: function(feature, layer) {
        layer.bindPopup(
            "<b>" + feature.properties["Feature Name"] +
            "</b><br>Elevation: " +
            feature.properties.Elevation + " ft"
        );
    }
});

// 6. Add summit points to map
NC_Summits.addTo(mymap);

NC_Summits.on('data:loaded', function() {
    console.log("Elevation category counts:", elevationCounts);
});

// 6. Set function for color ramp 
var countyColors = chroma.scale('Greens').colors(4); // i will use 4 classes of greens 

function setColor(count) {
    var id = 0;

    if (count > 25) { id = 3; }
    else if (count > 5) { id = 2; }
    else if (count > 0) { id = 1; }
    else { id = 0; }

    return countyColors[id];
}

var summitCounts = {};

$.getJSON("assets/NC_Summits.geojson", function(data) {

    data.features.forEach(function(feature) {

        // Only count North Carolina summits
        if (feature.properties.State !== "North Carolina") {
            return;
        }

        var county = feature.properties.County.replace(" County", "");

        if (summitCounts[county] === undefined) {
            summitCounts[county] = 0;
        }

        summitCounts[county]++;
    });

	  function style(feature) {

        var county = feature.properties.County;
        var count = summitCounts[county] || 0;

        return {
    fillColor: setColor(count),
    fillOpacity: 0.6,
    weight: 1.5,
    opacity: 1,
    color: '#333333'
};
    } 

	    L.geoJson.ajax("assets/NC_Boundaries.geojson", {
        style: style
    }).addTo(mymap);

}); 

var legend = L.control({position: 'topright'});

// 10. Function that runs when legend is added to map
legend.onAdd = function () {

    var div = L.DomUtil.create('div', 'legend');

    // County choropleth legend
    div.innerHTML += '<b>Summits per County</b><br />';
    div.innerHTML += '<i style="background: ' + countyColors[3] + '"></i><p>26+ summits</p>';
    div.innerHTML += '<i style="background: ' + countyColors[2] + '"></i><p>6–25 summits</p>';
    div.innerHTML += '<i style="background: ' + countyColors[1] + '"></i><p>1–5 summits</p>';
    div.innerHTML += '<i style="background: ' + countyColors[0] + '"></i><p>0 summits</p>';

    // Summit elevation legend
    div.innerHTML += '<hr><b>Summit Elevation</b><br />';
    div.innerHTML += '<i class="fas fa-mountain marker-color-1"></i><p>Under 2,000 ft</p>';
    div.innerHTML += '<i class="fas fa-mountain marker-color-2"></i><p>2,000–4,000 ft</p>';
    div.innerHTML += '<i class="fas fa-mountain marker-color-3"></i><p>Over 4,000 ft</p>';

    return div;
};

// 11. Add a legend to map
legend.addTo(mymap);

// 12. Add a scale bar to map
L.control.scale({position: 'bottomleft'}).addTo(mymap); 

// extra credit leaflet dialog plugin
var mapSize = mymap.getSize();

var dialogWidth = 480;
var dialogHeight = 340;

var dialog = L.control.dialog({
    size: [dialogWidth, dialogHeight],
    position: 'topleft',
    anchor: [
        (mapSize.y - dialogHeight) / 2,
        (mapSize.x - dialogWidth) / 2
    ],
    initOpen: true
});

dialog.setContent(
    '<div class="welcome-box">' +
    '<h2>Mountain Summits Across North Carolina</h2>' +
    '<p>Explore the distribution of mountain summits throughout North Carolina.</p>' +
    '<p>This interactive map displays summit locations categorized by elevation, alongside county-level shading representing the number of summits in each county.</p>' +
    '<b>How to use this map:</b>' +
    '<ul>' +
        '<li>Explore the different summit elevations.</li>' +
        '<li>Compare the number of summits across counties.</li>' +
        '<li>Use the legend to interpret the map symbols and colors.</li>' +
    '</ul>' +
    '<p><b>Close this window to explore the map!</b></p>' +
    '</div>'
);

dialog.addTo(mymap);

</script>
</body>
</html>
